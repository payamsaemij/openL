
name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-checks:
    name: Unit Tests, Coverage & Flake8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov flake8

      - name: Run unit tests with coverage
        run: |
          pytest \
            --cov=openlibrary \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Run Flake8
        run: |
          flake8 openlibrary tests \
            --max-line-length=88 \
            --statistics